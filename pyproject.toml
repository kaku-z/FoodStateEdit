[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foodstateedit-paper"
version = "0.1.0"
description = "Paper sprint workspace for physically constrained food manipulation editing"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23"]

[tool.setuptools.packages.find]
include = ["foodstateedit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

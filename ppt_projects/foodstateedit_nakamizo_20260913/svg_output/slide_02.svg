<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<line x1="72" y1="42" x2="1208" y2="42" stroke="#D8DDE3" stroke-width="2"/>
<text x="72" y="76" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="16" fill="#0070C0" font-weight="700" text-anchor="start" letter-spacing="1.8">PURPOSE</text>
<text x="72" y="123" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="42" fill="#222222" font-weight="700" text-anchor="start">研究目的：食べる瞬間を感じる食物画像</text>
<rect x="72" y="142" width="74" height="4" fill="#0070C0" stroke="none" stroke-width="1"/>
<text x="72" y="686" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="14" fill="#666666" font-weight="400" text-anchor="start">FoodStateEdit｜メディア情報学</text>
<text x="1208" y="686" font-family="Arial, Yu Gothic, sans-serif" font-size="16" fill="#0070C0" font-weight="700" text-anchor="end">02</text>
<g id="slide-content" data-pptx-bounds="72 160 1136 500">
<text x="76" y="196" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="23" fill="#0070C0" font-weight="700" text-anchor="start">研究目的</text>
<text x="76" y="242.0" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="31" fill="#222222" font-weight="700" text-anchor="start">普通の食物写真に、</text>
<text x="76" y="283.85" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="31" fill="#222222" font-weight="700" text-anchor="start">「食べる直前」の臨場感を加える</text>
<text x="76" y="340.0" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="20" fill="#222222" font-weight="500" text-anchor="start">道具で食物を動かす状態を生成し、</text>
<text x="76" y="372.0" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="20" fill="#222222" font-weight="500" text-anchor="start">見る人が味・食感・動きを想像できる</text>
<text x="76" y="404.0" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="20" fill="#222222" font-weight="500" text-anchor="start">視覚表現を目指す</text>
<line x1="76" y1="458" x2="522" y2="458" stroke="#D8DDE3" stroke-width="2"/>
<text x="76" y="500" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="23" fill="#0070C0" font-weight="700" text-anchor="start">利用場面</text>
<text x="92" y="540.0" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="20" fill="#666666" font-weight="600" text-anchor="start">食品メニュー・広告</text>
<text x="92" y="572.0" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="20" fill="#666666" font-weight="600" text-anchor="start">レシピ・食育・デジタル創作</text>
<rect x="594" y="192" width="276" height="278" fill="#F7F9FB" stroke="#D8DDE3" stroke-width="2" rx="6"/>
<image href="../images/p02_cake_input.png" x="600" y="198" width="264" height="266" preserveAspectRatio="xMidYMid meet"/>
<rect x="594" y="192" width="276" height="34" fill="#0070C0" stroke="none" stroke-width="0" rx="6"/>
<text x="608" y="216" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">普通の食物写真</text>
<line x1="879" y1="331" x2="912" y2="331" stroke="#E31B23" stroke-width="4"/>
<polygon points="912,323 924,331 912,339" fill="#E31B23" stroke="none" stroke-width="1"/>
<rect x="936" y="192" width="276" height="278" fill="#F7F9FB" stroke="#D8DDE3" stroke-width="2" rx="6"/>
<image href="../images/p02_cake_fork_scale0p6.png" x="942" y="198" width="264" height="266" preserveAspectRatio="xMidYMid meet"/>
<rect x="936" y="192" width="276" height="34" fill="#E31B23" stroke="none" stroke-width="0" rx="6"/>
<text x="950" y="216" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">操作状態を生成</text>
<rect x="594" y="500" width="618" height="78" fill="#EAF6FC" stroke="none" stroke-width="0" rx="6"/>
<text x="903" y="534" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="25" fill="#222222" font-weight="700" text-anchor="middle">静止した料理写真から、</text>
<text x="903" y="565" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="25" fill="#0070C0" font-weight="700" text-anchor="middle">食べる場面を想像できる画像へ</text>
<text x="903" y="603" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="14" fill="#666666" font-weight="400" text-anchor="middle">※ 視覚的な臨場感を対象とし、味覚刺激そのものは扱わない</text>
</g>
</svg>

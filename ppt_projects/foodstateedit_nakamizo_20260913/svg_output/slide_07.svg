<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<line x1="72" y1="42" x2="1208" y2="42" stroke="#D8DDE3" stroke-width="2"/>
<text x="72" y="76" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="16" fill="#0070C0" font-weight="700" text-anchor="start" letter-spacing="1.8">CONTROL MECHANISM</text>
<text x="72" y="123" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="42" fill="#222222" font-weight="700" text-anchor="start">3D操作代理がVACEへ渡す制御</text>
<rect x="72" y="142" width="74" height="4" fill="#0070C0" stroke="none" stroke-width="1"/>
<text x="72" y="686" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="14" fill="#666666" font-weight="400" text-anchor="start">FoodStateEdit｜メディア情報学</text>
<text x="1208" y="686" font-family="Arial, Yu Gothic, sans-serif" font-size="16" fill="#0070C0" font-weight="700" text-anchor="end">07</text>
<g id="relative3d-vace-dimensions" data-pptx-bounds="60 150 1160 525">
<rect x="72" y="164" width="1136" height="52" fill="#EAF6FC" stroke="#0070C0" stroke-width="2" rx="5"/>
<text x="640" y="196" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="24" fill="#0070C0" font-weight="700" text-anchor="middle">相対3D代理は生成モデルではなく、VACE前段の制御信号生成部</text>
<rect x="72" y="244" width="332" height="242" fill="#FFFFFF" stroke="#D8DDE3" stroke-width="2" rx="7"/>
<text x="238" y="278" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="22" fill="#0070C0" font-weight="700" text-anchor="middle">入力画像 + 操作指定</text>
<image href="../images/p05_ramen_input.png" x="98" y="294" width="280" height="112" preserveAspectRatio="xMidYMid meet"/>
<text x="238" y="438" font-family="Arial, Yu Gothic, sans-serif" font-size="18" fill="#222222" font-weight="700" text-anchor="middle">I_ref ∈ R^(512×688×3)</text>
<text x="238" y="467" font-family="Arial, Yu Gothic, sans-serif" font-size="15" fill="#666666" font-weight="500" text-anchor="middle">material ∈ R^4（one-hot）</text>
<rect x="474" y="244" width="332" height="242" fill="#F1FAF4" stroke="#2E8B57" stroke-width="3" rx="7"/>
<text x="640" y="278" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="22" fill="#2E8B57" font-weight="700" text-anchor="middle">相対3D操作代理 S_t</text>
<image href="../images/p05_ramen_control.png" x="500" y="294" width="280" height="92" preserveAspectRatio="xMidYMid meet"/>
<text x="640" y="416" font-family="Arial, Yu Gothic, sans-serif" font-size="16" fill="#222222" font-weight="700" text-anchor="middle">P_tool, P_food ∈ R^(K×3)</text>
<text x="640" y="444" font-family="Arial, Yu Gothic, sans-serif" font-size="15" fill="#666666" font-weight="500" text-anchor="middle">z_rel ∈ R、phase ∈ R^4</text>
<text x="640" y="472" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="17" fill="#2E8B57" font-weight="700" text-anchor="middle">透視投影で 21 frames</text>
<rect x="876" y="244" width="332" height="242" fill="#FFFFFF" stroke="#5BC0EB" stroke-width="3" rx="7"/>
<text x="1042" y="278" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="22" fill="#0070C0" font-weight="700" text-anchor="middle">VACE生成 → 局所合成</text>
<image href="../images/p05_ramen_output.png" x="902" y="294" width="280" height="92" preserveAspectRatio="xMidYMid meet"/>
<text x="1042" y="416" font-family="Arial, Yu Gothic, sans-serif" font-size="17" fill="#222222" font-weight="700" text-anchor="middle">C ∈ R^(21×512×688×3)</text>
<text x="1042" y="444" font-family="Arial, Yu Gothic, sans-serif" font-size="17" fill="#222222" font-weight="700" text-anchor="middle">M ∈ R^(21×512×688×1)</text>
<text x="1042" y="472" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="14" fill="#666666" font-weight="500" text-anchor="middle">領域内のみ更新、外側は原画像</text>
<line x1="406" y1="364" x2="466" y2="364" stroke="#0070C0" stroke-width="4"/>
<polygon points="466,356 478,364 466,372" fill="#0070C0" stroke="none" stroke-width="1"/>
<line x1="808" y1="364" x2="868" y2="364" stroke="#0070C0" stroke-width="4"/>
<polygon points="868,356 880,364 868,372" fill="#0070C0" stroke="none" stroke-width="1"/>
<rect x="72" y="526" width="1136" height="106" fill="#EAF6FC" stroke="#0070C0" stroke-width="2" rx="6"/>
<text x="96" y="558" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="20" fill="#0070C0" font-weight="700" text-anchor="start">VACEの担当</text>
<text x="96" y="590" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="18" fill="#222222" font-weight="500" text-anchor="start">制御動画 C が「どこを・いつ・どう動かすか」を伝え、mask M が変更可能領域を指定する。</text>
<text x="96" y="617" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="18" fill="#222222" font-weight="500" text-anchor="start">3D代理は外観を描く生成モデルではなく、接近 → 接触 → 持上げ → 停留の構造を符号化する前段制御器。</text>
<text x="72" y="659" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="14" fill="#E31B23" font-weight="600" text-anchor="start">※ 現行maskはSAM出力ではなく、21フレームの代理軌跡の和集合・膨張・羽化で生成。</text>
</g>
</svg>

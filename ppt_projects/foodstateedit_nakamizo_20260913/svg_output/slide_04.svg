<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<line x1="72" y1="42" x2="1208" y2="42" stroke="#D8DDE3" stroke-width="2"/>
<text x="72" y="76" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="16" fill="#0070C0" font-weight="700" text-anchor="start" letter-spacing="1.8">SUCCESS CRITERIA</text>
<text x="72" y="123" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="42" fill="#222222" font-weight="700" text-anchor="start">食物操作編集の成功条件</text>
<rect x="72" y="142" width="74" height="4" fill="#0070C0" stroke="none" stroke-width="1"/>
<text x="72" y="686" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="14" fill="#666666" font-weight="400" text-anchor="start">FoodStateEdit｜メディア情報学</text>
<text x="1208" y="686" font-family="Arial, Yu Gothic, sans-serif" font-size="16" fill="#0070C0" font-weight="700" text-anchor="end">04</text>
<g id="success-criteria" data-pptx-bounds="60 160 1160 525">
<rect x="72" y="184" width="520" height="340" fill="#F7F9FB" stroke="#D8DDE3" stroke-width="2" rx="6"/>
<image href="../images/p10_success_soup_output.png" x="78" y="190" width="508" height="328" preserveAspectRatio="xMidYMid meet"/>
<rect x="72" y="184" width="520" height="34" fill="#2E8B57" stroke="none" stroke-width="0" rx="6"/>
<text x="86" y="208" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">成功例：スプーンですくう状態</text>
<text x="332" y="556" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="19" fill="#666666" font-weight="500" text-anchor="middle">道具と食物の接触・移動を同時に確認</text>
<text x="656" y="198" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="25" fill="#0070C0" font-weight="700" text-anchor="start">三つの判定</text>
<rect x="656" y="244" width="520" height="78" fill="#FFFFFF" stroke="#D8DDE3" stroke-width="2" rx="6"/>
<circle cx="690" cy="283" r="21" fill="#EAF6FC" stroke="#0070C0" stroke-width="2"/>
<text x="690" y="290" font-family="Arial, Yu Gothic, sans-serif" font-size="14" fill="#0070C0" font-weight="700" text-anchor="middle">01</text>
<text x="728" y="277" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="22" fill="#222222" font-weight="700" text-anchor="start">動作が正しい</text>
<text x="728" y="304" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="17" fill="#666666" font-weight="500" text-anchor="start">道具の種類、接触位置、食物の追従</text>
<rect x="656" y="346" width="520" height="78" fill="#FFFFFF" stroke="#D8DDE3" stroke-width="2" rx="6"/>
<circle cx="690" cy="385" r="21" fill="#EAF6FC" stroke="#0070C0" stroke-width="2"/>
<text x="690" y="392" font-family="Arial, Yu Gothic, sans-serif" font-size="14" fill="#0070C0" font-weight="700" text-anchor="middle">02</text>
<text x="728" y="379" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="22" fill="#222222" font-weight="700" text-anchor="start">写真として自然</text>
<text x="728" y="406" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="17" fill="#666666" font-weight="500" text-anchor="start">道具・食物に明らかな変形や破綻がない</text>
<rect x="656" y="448" width="520" height="78" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2" rx="6"/>
<circle cx="690" cy="487" r="21" fill="#EAF6FC" stroke="#0070C0" stroke-width="2"/>
<text x="690" y="494" font-family="Arial, Yu Gothic, sans-serif" font-size="14" fill="#0070C0" font-weight="700" text-anchor="middle">03</text>
<text x="728" y="481" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="22" fill="#222222" font-weight="700" text-anchor="start">背景を保持</text>
<text x="728" y="508" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="17" fill="#666666" font-weight="500" text-anchor="start">容器・机・背景など非編集領域が変わらない</text>
<rect x="656" y="572" width="520" height="54" fill="#FFF5F5" stroke="#E31B23" stroke-width="2" rx="5"/>
<text x="916" y="606" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="23" fill="#E31B23" font-weight="700" text-anchor="middle">Strict成功 = 三条件をすべて満たす</text>
<text x="656" y="655" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="14" fill="#666666" font-weight="500" text-anchor="start">評価は平均点ではなく、Action × Photo × Preservation の同時成立</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<line x1="72" y1="42" x2="1208" y2="42" stroke="#D8DDE3" stroke-width="2"/>
<text x="72" y="76" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="16" fill="#0070C0" font-weight="700" text-anchor="start" letter-spacing="1.8">EVALUATION</text>
<text x="72" y="123" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="42" fill="#222222" font-weight="700" text-anchor="start">評価指標の定義と計算</text>
<rect x="72" y="142" width="74" height="4" fill="#0070C0" stroke="none" stroke-width="1"/>
<text x="72" y="686" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="14" fill="#666666" font-weight="400" text-anchor="start">FoodStateEdit｜メディア情報学</text>
<text x="1208" y="686" font-family="Arial, Yu Gothic, sans-serif" font-size="16" fill="#0070C0" font-weight="700" text-anchor="end">14</text>
<g id="metric-definitions" data-pptx-bounds="60 150 1160 525">
<rect x="72" y="174" width="548" height="430" fill="#FFFFFF" stroke="#D8DDE3" stroke-width="2" rx="7"/>
<text x="98" y="214" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="25" fill="#0070C0" font-weight="700" text-anchor="start">画像指標</text>
<text x="98" y="258" font-family="Arial, Yu Gothic, sans-serif" font-size="19" fill="#222222" font-weight="700" text-anchor="start">PSNR</text>
<text x="310" y="258" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="15" fill="#666666" font-weight="500" text-anchor="start">画素誤差の尺度（高いほど保持）</text>
<text x="98" y="304" font-family="Arial, Yu Gothic, sans-serif" font-size="19" fill="#222222" font-weight="700" text-anchor="start">SSIM</text>
<text x="310" y="304" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="15" fill="#666666" font-weight="500" text-anchor="start">構造類似度（高いほど保持）</text>
<text x="98" y="350" font-family="Arial, Yu Gothic, sans-serif" font-size="18" fill="#222222" font-weight="700" text-anchor="start">outside MAE</text>
<text x="310" y="350" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="15" fill="#666666" font-weight="500" text-anchor="start">Ω_out の平均絶対画素差</text>
<text x="98" y="396" font-family="Arial, Yu Gothic, sans-serif" font-size="18" fill="#222222" font-weight="700" text-anchor="start">exact preserve</text>
<text x="310" y="396" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="15" fill="#666666" font-weight="500" text-anchor="start">差が0の領域外画素割合</text>
<rect x="98" y="444" width="474" height="112" fill="#EAF6FC" stroke="#0070C0" stroke-width="1" rx="5"/>
<text x="335" y="478" font-family="Arial, Yu Gothic, sans-serif" font-size="22" fill="#0070C0" font-weight="700" text-anchor="middle">MAE_out = 1/|Ω_out|</text>
<text x="335" y="514" font-family="Arial, Yu Gothic, sans-serif" font-size="19" fill="#222222" font-weight="600" text-anchor="middle">Σ_(p∈Ω_out) |I_out(p) − I_ref(p)|</text>
<text x="335" y="542" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="16" fill="#666666" font-weight="500" text-anchor="middle">低いほど非編集領域を保持</text>
<rect x="660" y="174" width="548" height="430" fill="#FFFFFF" stroke="#D8DDE3" stroke-width="2" rx="7"/>
<text x="686" y="214" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="25" fill="#2E8B57" font-weight="700" text-anchor="start">意味判定</text>
<text x="686" y="258" font-family="Arial, Yu Gothic, sans-serif" font-size="21" fill="#222222" font-weight="700" text-anchor="start">Action</text>
<text x="846" y="258" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="17" fill="#666666" font-weight="500" text-anchor="start">道具・接触・食物追従が正しい</text>
<text x="686" y="304" font-family="Arial, Yu Gothic, sans-serif" font-size="21" fill="#222222" font-weight="700" text-anchor="start">Photo</text>
<text x="846" y="304" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="17" fill="#666666" font-weight="500" text-anchor="start">変形・複製・破綻がなく写真として自然</text>
<text x="686" y="350" font-family="Arial, Yu Gothic, sans-serif" font-size="21" fill="#222222" font-weight="700" text-anchor="start">Preservation</text>
<text x="846" y="350" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="17" fill="#666666" font-weight="500" text-anchor="start">容器・机・背景などを保持</text>
<text x="686" y="396" font-family="Arial, Yu Gothic, sans-serif" font-size="21" fill="#E31B23" font-weight="700" text-anchor="start">Strict</text>
<text x="846" y="396" font-family="Arial, Yu Gothic, sans-serif" font-size="17" fill="#E31B23" font-weight="700" text-anchor="start">Action ∧ Photo ∧ Preservation</text>
<rect x="686" y="444" width="474" height="112" fill="#FFF5F5" stroke="#E31B23" stroke-width="1" rx="5"/>
<text x="923" y="478" font-family="Arial, Yu Gothic, sans-serif" font-size="22" fill="#E31B23" font-weight="700" text-anchor="middle">Strict = 1</text>
<text x="923" y="514" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="18" fill="#222222" font-weight="600" text-anchor="middle">三つの判定をすべて満たす場合だけ</text>
<text x="923" y="542" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="16" fill="#666666" font-weight="500" text-anchor="middle">平均スコアではない</text>
<text x="72" y="646" font-family="Yu Gothic, Arial, Meiryo, sans-serif" font-size="15" fill="#E31B23" font-weight="600" text-anchor="start">現状：Action・Photoは内部非盲検の開発判定。今後は2〜3名の盲評と画像単位bootstrap CIを予定。</text>
</g>
</svg>
